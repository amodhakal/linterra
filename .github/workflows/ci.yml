name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (Ubuntu, clang)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libgl1-mesa-dev \
            libglfw3-dev \
            libglm-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTS=ON

      - name: Build
        # Build the default target set, not just linterra_tests, so a broken
        # game build can't reach main green.
        run: cmake --build build -j"$(nproc)"

      - name: Test
        # ctest returns non-zero if any test fails, which fails the job and
        # blocks the push/merge.
        run: ctest --test-dir build --output-on-failure
